<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sales Insights{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand">Sales<span>Insights</span></div>
  <nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('upload') }}">Import CSV</a><a href="{{ url_for('sales') }}">Sales Records</a></nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>Sales Data Analysis System · Flask + Pandas + NumPy-ready analytics</footer>
</body>
</html>
